# General Exposed Variables
profile: standard
theme: catppuccin-mocha
font_family: "FiraCode Nerd Font"
font_size: 12
opacity: 0.85
terminal: ghostty

# Search and Navigation Tools
search_tool: ripgrep            # Options: [ripgrep, fd, grep]

# Neovim Language Servers (LSP)
lsp_servers:
  - pyright
  - tsserver
  - gopls
  - lua_ls

