#   I. Development Runtimes & Compilers
# These power your active programming environments:
#  * Go (v1.26.2 darwin/arm64): Active runtime for Go development, optimized natively for Apple Silicon.
#  * Node.js & npm (v26.5.0 / npm v11.17.0): Extremely modern, cutting-edge Node runtime environment.
#  * Python (v3.14.3 via Homebrew & pyenv support): Multi-version Python environment featuring python@3.9, python@3.12, python@3.13, and python@3.14 support.
#  * .NET SDK (dotnet@9): Microsoft's open-source developer platform for C# and cross-platform runtimes.
#  * Lua (v5.5.0 & luajit): High-performance lua interpreter supporting your Neovim configurations.
#  * PowerShell (v7.5.4): Cross-platform command-line shell and scripting language.
#
# II. Infrastructure, Cloud, & Containerization
# Your active tools for building, deploying, and managing modern cloud systems (highly optimized for AWS, GCP, and Kubernetes):
#  * Docker (Docker.app & docker-compose): Container runtime engine and multi-container orchestration.
#  * Terraform (v1.15.6): HashiCorp Infrastructure as Code tool (managed via active configurations and parallel state-modifying scripts).
#  * CDK for Terraform (cdktf): Synthesize Terraform configurations using standard programming languages.
#  * Pulumi (v3.222.0): Modern Infrastructure as Code using real development languages.
#  * Packer (v1.15.0): HashiCorp automated machine images builder.
#  * Google Cloud SDK (gcloud): Programmatic access to Google Cloud, complete with interactive FZF search integrations (.fzf-gcloud.plugin.zsh).
#  * AWS CLI (v2.33.26): Command-line client for Amazon Web Services.
#  * Scaleway CLI (scw): Command-line tool for Scaleway Cloud services.
#  * Kubernetes Control:
#      * kubectl (v1.31.4) + kubecolor: Colorized command-line utility for managing cluster resources.
#      * kubectx & kubens: Rapid cluster context and namespace switchers.
#      * helm: Kubernetes package manager.
#      * kustomize: Customizer for Kubernetes YAML declarations.
#  * Open Policy Agent (opa): Policy engine for unified host-level and service-level rules.
#
# III. High-Performance Terminal Utilities (Rust/Go Core)
# You have systematically replaced older, slower Unix standards with highly optimized Rust or Go alternatives:
#  * bat: Syntax-highlighting clone of cat with Git integration, currently mapped to Catppuccin Mocha colors.
#  * lsd: Modern file lister supporting rich color formatting, directory sorting, and filetree displays.
#  * ripgrep (rg): The fastest search utility in the ecosystem; drives both your Neovim picker and your Zsh fzf inputs.
#  * fd: Extremely fast file searcher, used as an alternative to find.
#  * fzf: Command-line fuzzy finder powering workspace search, project sessionizing, and cloud utility hooks.
#  * direnv: Automatic folder-scoped environment shell variables loader.
#  * just: Handy development script command runner (a sleek alternative to make).
#  * uv: Ultra-fast Python package installer, compiler, and resolver.
#  * stow: GNU symlink farm manager (used directly to cleanly symlink your .dotfiles directory folders to ~/.config).
#  * tldr: Community-driven simplified command cheat sheets.
#  * cheat: CLI interactive cheat sheet loader targeting cht.sh via tmux windows.
#  * stew, mole, moor: Dedicated development terminal helpers.
#
# ---
#
# IV. Specialized Terminal Pagers & Viewers
# A robust selection of pagers designed to display terminal buffers and manual entries with maximum visual precision:
#  * nvimpager: Uses Neovim in terminal pager mode.
#  * page: Feature-rich terminal pager.
#  * ov: Advanced terminal pager supporting wide formats and syntax highlights.
#  * gtop: Graphical system monitoring dashboard.
#  * htop: Classic interactive terminal process monitor.
#
# V. Security, Validation, & Formatting
# Your active guardrails against bad commits, secrets, and spelling issues:
#  * pre-commit: Git hook framework to run checks before committing.
#  * detect-secrets: Static scanner targeting raw secrets and api keys.
#  * gitleaks & trufflehog: High-speed security scanners analyzing deep git histories for leaked tokens.
#  * sops: Secret management tool to encrypt/decrypt values files (Sops-encrypted yaml).
#  * vale: Grammar, style, and vocabulary linter for markdown/prose.
#
# VI. Neovim & Terminal Ecosystem (Console Interfaces)
#  * Ghostty (Ghostty.app): High-speed, borderless terminal client utilizing the Apple display-p3 colorspace with Macchiato/Mocha themes.
#  * Neovim (v0.12.2): Your primary modal text editor, featuring Harpoon 2 speed dials, a custom Wiki linking interface, and standard Snacks.nvim visual search buffers.
#  * Tmux (v3.6a): Interactive terminal session manager featuring continuum/resurrect plugins, custom system monitors in the status bar, and custom visual copy mode selections.
#  * Starship Prompt: Minimal, blazing-fast, and information-rich cross-shell prompt.
#
# VII. macOS Desktop & Tiling Layer
#  * AeroSpace (AeroSpace.app): i3-style keyboard-driven window management running in keyboard-focus-follows-mouse mode.
#  * JankyBorders (borders): active/inactive window border rendering, giving clear high-speed feedback on focus changes.
#  * Vial (Vial.app): Open-source GUI to program, map, and flash customized layouts to your mechanical keyboard (supports QMK/Vial keyboards).
#  * Flycut (Flycut.app): Keyboard-driven clipboard history buffer manager.
#  * Syncthing (Syncthing.app): Real-time, continuous peer-to-peer file synchronization engine (keeps your files across physical nodes in sync).
#
# VIII. GUI Productivity, Knowledge, & Creativity Apps
#  * Obsidian (Obsidian.app): Local-first plain-text markdown notebook. (Sits next to your Xanadu Wiki in ~/Documents/wiki).
#  * Zotero (Zotero.app): Personal research assistant, reference aggregator, and paper citation manager.
#  * Anki (Anki.app): Intelligent spaced-repetition flashcard application.
#  * Antigravity & Antigravity IDE (Antigravity.app): Native IDE / Workspace companion application.
#  * DaVinci Resolve & Proxy Generator (DaVinci Resolve.app): Industry standard, non-linear video editing, grading, and visual effects software.
#  * balenaEtcher & Raspberry Pi Imager: Bare-metal operating system micro-SD card flasher tools.
#  * Slack / Spotify / Google Drive / Chrome / VS Code: Standard graphical communication, audio, file storage, web browsing, and backup editor suites.

# I. The Environment Inventory

# Here is the structured inventory of the software, configurations, and custom integrations currently operating in your system, categorized by their structural layers:

#    ┌────────────────────────────────────────────────────────┐
#    │ 1. OS & DESKTOP LAYER: AeroSpace Tiling WM + Borders   │
#    └───────────────────────────┬────────────────────────────┘
#                                ▼
#    ┌────────────────────────────────────────────────────────┐
#    │ 2. TERMINAL LAYER: Ghostty (GPU-accelerated, display-p3)│
#    └───────────────────────────┬────────────────────────────┘
#                                ▼
#    ┌────────────────────────────────────────────────────────┐
#    │ 3. SHELL LAYER: Zsh + Starship Prompt + lsd + bat      │
#    └───────────────────────────┬────────────────────────────┘
#                                ▼
#    ┌────────────────────────────────────────────────────────┐
#    │ 4. MULTIPLEXER: Tmux + sessionizer + tmux-sessionx     │
#    └───────────────────────────┬────────────────────────────┘
#                                ▼
#    ┌────────────────────────────────────────────────────────┐
#    │ 5. EDITOR: Neovim (Lua, snacks.nvim Picker, Harpoon 2) │
#    └───────────────────────────┬────────────────────────────┘
#                                ▼
#    ┌────────────────────────────────────────────────────────┐
#    │ 6. DOMAIN KNOWLEDGE: Xanadu Wiki + GCP Architecture    │
#    └────────────────────────────────────────────────────────┘

# 1. OS & Desktop Layer (Window Management)
#  * AeroSpace Window Manager: An i3-like, keyboard-driven tiling window manager for macOS.
#      * Navigation: Bound to alt-h/j/k/l for movement; alt-ctrl-h/j/k/l for window shifts.
#      * Layout Control: alt-slash (toggle tile orientations), alt-shift-f (fullscreen), and alt-z (accordion "zoom" mode).
#      * Workspace Routing: alt-1..9 with back-and-forth toggle (alt-p).
#  * JankyBorders: Provides zero-latency visual feedback on window focus (0xff000000 active vs. 0xff494d64 inactive, width=1).
#  * System Integration: focus-follows-mouse is active with automatic mouse centering (move-mouse window-lazy-center), keeping your physical pointer and focus in perfect sync.

# 2. Terminal Layer (The Interface)
#  * Ghostty: GPU-accelerated terminal emulator configured for display quality and speed.
#      * Aesthetics: Borderless (window-decoration = none, macos-titlebar-style = hidden), rendering in the wide display-p3 colorspace with native alpha blending.
#      * Typography: FiraCode Nerd Font (size 12) featuring ligatures (calt, liga) and a slashed zero (zero) for coding clarity.
#      * Key Mapping: macos-option-as-alt = left enables option mapping directly into AeroSpace/Tmux controls.

# 3. Shell Layer (Command Line)
#  * Zsh (highly modular): Featuring custom error traps, safe module sourcing, and 50,000-line history sharing.
#  * Modern CLI Replacements:
#      * cat ➔ bat (integrated with Catppuccin Mocha colors and Git change margins).
#      * ls ➔ lsd (folder-first visual trees with icons).
#      * PAGER ➔ nvimpager or page (giving you Vim navigation for all scrollable CLI outputs).
#      * MANPAGER ➔ nvim +Man! (fully syntax-highlighted manual pages).
#  * Interactive Fuzzy Finding (FZF + Ripgrep):
#      * Default commands mapped to high-speed ripgrep searches (rg --files --hidden --glob '!.git/*').
#      * Intelligent previews: Folders render as visual trees (lsd --tree); files render with syntax-highlighted code blocks (bat).
#      * High-speed Aliases: e fuzzy-finds and opens any file in Neovim (fzf | xargs -o nvim), and wikisearch() dynamically searches your knowledge base and jumps directly to the matching line inside Neovim on Enter.
#  * Pre-computed ISO Date Tokens: Highly portable global environment variables (today, m3, m1, w1, d3, d1, h6, h3, h1) that resolve to RFC-3339 timestamps for instant copy-pasting into cloud logs queries.

# 4. Multiplexer Layer (Project Sessions)
#  * Tmux: Configured with Catppuccin status bars and custom CPU/RAM resource status indicators.
#      * Prefix: Ergononomic C-space override.
#      * Sessionizer (~/.local/bin/sessionizer): Bound to prefix + e. Dynamically aggregates directory paths from your workspace and project folders into a fuzzy-selectable launcher that spawns clean, isolated project sessions.
#      * Interactive Cheat Sheet (cheat): Rapidly queries cht.sh via fzf in an ephemeral window.
#      * Status renaminig: Auto-renames windows to either the running command (e.g. nvim) or the current folder name to avoid status-bar clutter.

# 5. Editor Layer (High-Performance Development)
#  * Neovim (Lua-first config):
#      * File & Text Pickers: Powered by folke/snacks.nvim, a modern, blazing-fast alternative to Telescope (<leader>sf files, <leader>sg grep, <leader>sb buffers).
#      * Speed Dialing: Harpoon 2 is bound to <leader>a (add) and your home row (<leader>j/k/l/; for files 1-4) for muscle-memory hopping between active project files.

# 6. Domain-Specific Layers (Infrastructure & Knowledge)
#  * Xanadu Wiki & Atlas Workspace: Dedicated Markdown-based personal knowledge base.
#      * Neovim Wiki integration: Custom <leader>xx files picker that filters out binaries and binds <C-l> in insert mode to instantly format and paste markdown-style wiki links ([[wiki-page-name]]).
#  * Terraform Speed-Ups: Programmatic shortcuts for validating and running targets, alongside advanced parallel state manipulation functions (tsrmt, tsrmq, tsrm) that extract plan outputs, isolate target assets, and concurrently strip
#    them from remote state via xargs.
#  * Kubernetes & Google Cloud: Immediate, terminal-wide hotkeys: ^x to switch context (kubectx) and ^s to switch namespace (kubens).

# II. The Productivity & Navigation Flywheel

# Your system forms an incredibly satisfying nested loop. Each scope of navigation operates on a dedicated plane, removing cognitive load:
# AeroSpace (Workspace) ⟶ Tmux (Project Session) ⟶ Neovim (Target Buffer) ⟶ Harpoon (Exact File)

#  1. Macro Navigation (System): You move across workspaces with alt-1..9 and split application layouts without thinking.
#  2. Meso Navigation (Projects): When moving to another project context, you press C-space + e, search, and hit Enter. You are instantly dropped into a clean tmux session with Neovim running in that folder.
#  3. Micro Navigation (Files): Inside Neovim, you do not browse a file tree. You use <leader>j/k/l/; to jump directly to your most critical files via Harpoon, or <leader>sf for high-performance fuzzy matching via Snacks.

# III. Proposals to Elevate Satisfaction, Joy, & Speed

# Because your dotfiles are already highly optimized, adding "bloat" would hurt your productivity. These 3 surgical additions are designed to expand your existing setups to maximum efficiency:

# 1. Global Project Launcher (AeroSpace ➔ Tmux Sessionizer Integration)
# Right now, to switch projects, you have to be inside Ghostty and inside tmux to hit C-space + e. You can bind a global hotkey directly in AeroSpace to launch your sessionizer inside a floating, temporary Ghostty window from anywhere on
# your computer.

# Add this to your ~/.config/aerospace/aerospace.toml:

#  1 # Press Alt+E anywhere on macOS to open a floating project selector!
#  2 alt-e = "exec-and-forget osascript -e 'tell application \"Ghostty\" to write active terminal text \"~/.local/bin/sessionizer\\n\"'"
# (Alternatively, you can configure Ghostty to launch a quick visual window running sessionizer natively as its starting command).

# 2. Seamless Terminal-Editor Splits Navigation
# If you use Vim splits inside Neovim alongside Tmux splits, jumping between them normally requires two different sets of hotkeys (Tmux's C-space h/j/k/l and your editor's split-switching).
#  * The Change: Install a seamless split navigator (like christoomey/vim-tmux-navigator or a Lua equivalent).
#  * The Joy: You can use a single hotkey scheme (e.g. ctrl-h/j/k/l) to jump seamlessly across Neovim splits and Tmux splits as if they were a single contiguous surface.

# 3. Supercharged Zsh Autocomplete (fzf-tab)
# Your autocomplete menu in Zsh uses the standard terminal selection format.
#  * The Change: Install the fzf-tab plugin for Zsh.
#  * The Joy: It replaces Zsh's default Tab completion menu with a rich, interactive fzf panel.
#    When you type cd <tab> or git log <tab>, it will render a visual list complete with your custom lsd trees and bat file previews directly inside
#    your shell prompt before you even hit enter.
