# --- Terminal Fixes ---
# Fix terminal colors (ensure true color support)
set -g default-terminal 'screen-256color'
set -ag terminal-overrides ',xterm-256color*:RGB'
set -ag terminal-overrides ',xterm-ghostty:RGB'
set -g allow-passthrough on

# --- Prefix ---
unbind C-b
set -g prefix C-space

# --- TPM Setup ---
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.config/tmux/plugins/'

# Auto-install TPM if missing
if 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tpm"' {
  run 'mkdir -p "${TMUX_PLUGIN_MANAGER_PATH}"'
  run 'git clone https://github.com/tmux-plugins/tpm "${TMUX_PLUGIN_MANAGER_PATH}/tpm"'
  run '${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'
}

# --- General Settings ---
set -g mouse on
set -g history-limit 10000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off
set -g status-position top
set -g status-interval 5
set -g xterm-keys on
set -sg escape-time 0
setw -q mode-keys vi

# --- Gaps and Style ---
set -g @catppuccin_status_background "default"

# --- Keybindings ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind -r ^ last-window
bind -T prefix \; select-pane -t :.-\; resize-pane -Z
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r e run-shell "tmux neww ~/.local/bin/sessionizer"

# Copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Split panes
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Configure tmux-cpu icons
set -g @cpu_low_icon "󰾆"
set -g @cpu_med_icon "󰾅"
set -g @cpu_high_icon "󰓅"
set -g @ram_low_icon "󰍛"
set -g @ram_med_icon "󰍛"
set -g @ram_high_icon "󰍛"

# --- Catppuccin Theme Configuration ---
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
# Enable automatic renaming and set a short format (folder or process)
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m/ri:^(bash|zsh)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

# Prevent shell from renaming windows (keeps things clean)
set -g allow-rename off

# Catppuccin window text - just show the (now short) window name
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'
set -g @catppuccin_date_time_text ' %d/%m %H:%M'

# Load Catppuccin manually to ensure it applies before status setup
run '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux'

# --- Status Bar Configuration ---
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session} " 

# CLEAR status-right first to avoid duplication on reload
set -g status-right '' 
set -ag status-right '#[fg=#{E:@thm_red}]#{cpu_icon} #{cpu_percentage}   '
set -ag status-right '#[fg=#{E:@thm_yellow}]#{ram_icon} #{ram_percentage}   '
set -ag status-right '#{E:@catppuccin_status_date_time} ' 

# --- Initialize TPM ---
run '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'

# Final override to ensure transparency/matching background
set -g status-style bg=default
