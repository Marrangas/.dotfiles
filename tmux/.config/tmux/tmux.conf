# --- Terminal Fixes ---
# Fix terminal colors (ensure true color support)
# Fix terminal colors (ensure true color support and italics)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Enable italics (this is the magic line for tmux -> ghostty)
set -as terminal-overrides ',xterm*:sitm=\E[3m'
set -g allow-passthrough on

# --- Prefix ---
unbind C-b
set -g prefix C-space

# --- TPM Setup ---
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.config/tmux/plugins/'

# Auto-install TPM if missing
if 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tpm"' {
  run 'mkdir -p "${TMUX_PLUGIN_MANAGER_PATH}"'
  run 'git clone https://github.com/tmux-plugins/tpm "${TMUX_PLUGIN_MANAGER_PATH}/tpm"'
  run '${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'
}

# --- General Settings ---
set -g mouse on
set -g history-limit 10000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off
set -g status-position top
set -g status-interval 5
set -g xterm-keys on
set -sg escape-time 0
setw -q mode-keys vi

# --- Gaps and Style ---
set -g @catppuccin_status_background "default"

# --- Keybindings ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind -r ^ last-window
bind -T prefix \; select-pane -t :.-\; resize-pane -Z
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r e run-shell "tmux neww ~/.local/bin/sessionizer"

# -- resizing panes with larger increments --
bind < resize-pane -L 10
bind > resize-pane -R 10
bind + resize-pane -D 10
bind - resize-pane -U 10

# --move windows 
# are there any way to work with cmd alt and arrows as in chome?
bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

# Split panes
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_status_background "#222436" # TokyoNight Moon background color
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Configure tmux-cpu icons
set -g @cpu_low_icon "󰾆"
set -g @cpu_med_icon "󰾅"
set -g @cpu_high_icon "󰓅"
set -g @ram_low_icon "󰍛"
set -g @ram_med_icon "󰍛"
set -g @ram_high_icon "󰍛"

# --- Catppuccin Theme Configuration ---
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'

# --- Remote Session Context ---
# Cache the remote info once at startup to keep window headers fast and clean
if-shell '[ -n "$SSH_CONNECTION" ]' {
    if-shell '[ "$(whoami)" != "altostratus" ]' {
        set -g @remote_label "#U@#h: "
    } {
        set -g @remote_label "#h: "
    }
} {
    set -g @remote_label ""
}

# Enable automatic renaming and set the format
# Logic: If at shell (zsh/bash), show the folder. If in a process (nvim/git), show the process name.
set -g automatic-rename on
set -g automatic-rename-format '#{@remote_label}#{?#{m/ri:bash|zsh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

# Prevent shell from renaming windows (keeps things clean)
set -g allow-rename off

# Catppuccin window text - just show the short window name
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'
set -g @catppuccin_date_time_text ' %d/%m %H:%M'

# Load Catppuccin manually to ensure it applies before status setup
run '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux'

# --- Status Bar Configuration ---
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session} " 

# CLEAR status-right first to avoid duplication on reload
set -g status-right '' 
set -ag status-right '#[fg=#{E:@thm_red}]#{cpu_icon} #{cpu_percentage}   '
set -ag status-right '#[fg=#{E:@thm_yellow}]#{ram_icon} #{ram_percentage}   '
set -ag status-right '#{E:@catppuccin_status_date_time} ' 

# --- Initialize TPM ---
run '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'

# Final override to ensure transparency/matching background
set -g status-style bg=default

# --- Custom Copy Mode (APPLIED LAST TO OVERRIDE PLUGINS) ---
# This setup improves the copy experience by:
# 1. Making the selection highly visible.
# 2. Allowing you to stay in copy mode after copying to select/copy again.
# 3. Using 'pbcopy' to copy directly to the system clipboard (macOS).
# You can exit copy mode by pressing 'q' or 'Escape'.

# Use bright colors for visual feedback on selection
set-window-option -g mode-style "fg=black,bg=yellow"

# -- vi-like bindings for copy mode --
# Use '[' to enter copy mode
bind [ copy-mode

# 'v' to begin selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
# 'C-v' for rectangle (visual block) selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# 'y' to yank (copy) the selection to the system clipboard and *stay in copy mode*.
# After copying, the selection is cleared to provide visual feedback.
# This replaces the default behavior of exiting copy mode.
bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy" \; send-keys -X clear-selection

# The original binding for mouse dragging is good, let's keep it. It also
# copies and stays in copy mode.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

