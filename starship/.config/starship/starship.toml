# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Use custom palette
palette = "catppuccin_macchiato"

# Configure the format
format = """
$directory$git_branch$git_status$fill$cmd_duration$aws${custom.gcloud}$terraform$kubernetes$nix_shell$python
$character"""

# Move these to the right (if supported by terminal/shell)
right_format = ""

[directory]
style = "bold lavender"
# style = "bg:lavender fg:surface0"
truncation_length = 4
truncation_symbol = "~/../"
format = "[ $path ]($style) "

[fill]
symbol = " "

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'

[aws]
symbol = "a:"
style = "bold peach"
format = '[$symbol:$profile]($style) '


[gcloud]
disabled = false
symbol = "g"
style = "bold blue"
format = '[$symbol:$active]($style) '
detect_files = ['.envrc']             
detect_folders = [ ]

[kubernetes]
symbol = "k"
style = "bold blue"
format = '[$symbol:$context: ($namespace)]($style) '

[nix_shell]
symbol = "nix"
style = "bold blue"
format = "[$symbol]:($style) "

[terraform]
disabled = false
symbol = "tw"
style = "bold mauve"
format = '[$symbol:$workspace]($style) '
detect_folders = [ ]

[python]
symbol = "py"
style = "bold yellow"
format = '[$symbol:$version:($virtualenv)]($style) '
detect_extensions = ['py']
detect_files = ['.python-version', 'pyproject.toml', 'setup.py', 'requirements.txt', 'Pipfile', 'tox.ini']
detect_folders = []

[cmd_duration]
min_time = 5_000
style = "bold surface2"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c1c4"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
