14\Command=copyq: \nvar text = str(data("text/plain"));\nif (text.match(/^https?:\\/\\//)) {\n    var url = text;\n    url = url.replace(/([?&])utm_[^&]+/g, "");\n    url = url.replace(/([?&])fbclid=[^&]+/g, "");\n    url = url.replace(/([?&])gclid=[^&]+/g, "");\n    url = url.replace(/\\?&/, "?");\n    url = url.replace(/\\?$/, "");\n    if (url !== text) {\n        setData("text/plain", url);\n    }\n}
14\Icon=\xf0c1
14\Input=text/plain
14\IsInternal=true
14\Name=Clean URL Tracking Parameters
